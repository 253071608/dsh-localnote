# dsh-localnote bundle patch.
# Applied when the plugin is installed via `dsh plugin --profile <name> add @253071608/dsh-localnote`.
# Registers the node-side plugin entry; the client half is picked up
# automatically from `dsh.client` in package.json by dsh-client-modules.
- insert:
    - id: dsh-localnote
      name: '@253071608/dsh-localnote'
